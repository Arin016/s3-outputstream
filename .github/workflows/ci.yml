name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 11, 17, 21 ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: corretto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare local S3 fixture
        run: |
          python -m venv .local-tools/venv
          .local-tools/venv/bin/python -m pip install -r tools/local/requirements.txt
      - name: Verify unit tests, local integration, sources and Javadocs
        run: .local-tools/venv/bin/python tools/local/run_integration.py --output target/local-evidence
      - name: Inspect distributable contents
        run: python tools/release/check_artifacts.py --output target/package-inspection.json
      - name: Archive verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-${{ matrix.java }}-evidence
          path: |
            target/local-evidence/
            target/package-inspection.json
            target/*-sources.jar
            target/*-javadoc.jar
